openapi: 3.0.3
info:
  title: Sweet Scoop API
  description: |
    RESTful API for Sweet Scoop — an online Ice Cream & Cake ordering platform.
    Composed of six microservices (Catalogue, Customer, Order, Payment, Delivery, Reviews).
    All endpoints are versioned under `/v1`. Errors follow RFC 7807 Problem Details.
  version: 1.0.0
  contact:
    name: Sweet Scoop Engineering
    email: eng@sweetscoop.example.com
  license:
    name: MIT

servers:
  - url: http://localhost:3000/v1
    description: API Gateway (local dev)
  - url: https://api.sweetscoop.example.com/v1
    description: Production

tags:
  - name: Catalogue
  - name: Customer
  - name: Orders
  - name: Payments
  - name: Delivery
  - name: Reviews

security:
  - bearerAuth: []

paths:
  # ======================== CATALOGUE ========================
  /products:
    get:
      tags: [Catalogue]
      summary: List products
      description: Returns a paginated, filterable list of products.
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - in: query
          name: category
          schema: { type: string }
          description: Filter by category id
        - in: query
          name: flavor
          schema: { type: string }
        - in: query
          name: tag
          schema: { type: string }
          description: Dietary tag filter
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Product list
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  next: { type: string, nullable: true, description: Cursor pagination link }
    post:
      tags: [Catalogue]
      summary: Create a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}:
    get:
      tags: [Catalogue]
      summary: Get a product
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Product found
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Catalogue]
      summary: Update a product (full)
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Catalogue]
      summary: Delete a product
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Product deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}/inventory:
    patch:
      tags: [Catalogue]
      summary: Adjust product inventory
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta: { type: integer, description: 'Positive to add, negative to deduct' }
                reason: { type: string }
      responses:
        '200':
          description: Inventory updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  productId: { type: string }
                  stock: { type: integer }
                  reserved: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /categories:
    get:
      tags: [Catalogue]
      summary: List categories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }

  # ======================== CUSTOMER ========================
  /customers:
    post:
      tags: [Customer]
      summary: Register a customer
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Customer registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /customers/{id}:
    get:
      tags: [Customer]
      summary: Get customer profile
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customer]
      summary: Update the authenticated customer's profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 255 }
                fullName: { type: string, minLength: 1, maxLength: 200 }
                phone: { type: string, nullable: true, maxLength: 30 }
      responses:
        '200':
          description: Updated customer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /customers/{id}/addresses:
    get:
      tags: [Customer]
      summary: List customer addresses
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
    post:
      tags: [Customer]
      summary: Add an address
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Address added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Customer]
      summary: Authenticate and receive JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  customerId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ======================== ORDERS ========================
  /top-buyers:
    get:
      tags: [Orders]
      summary: List the most frequent buyers
      description: Returns the five customers with the most completed orders using anonymous display names.
      security: []
      responses:
        '200':
          description: Anonymized buyer leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, orderCount, amountSpent]
                  properties:
                    name: { type: string, example: 'Scooper #A1B2C3' }
                    orderCount: { type: integer, example: 4 }
                    amountSpent: { type: number, format: float, example: 76.45 }
  /orders:
    post:
      tags: [Orders]
      summary: placeOrder — create an order (saga)
      description: Orchestrates payment and delivery creation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: Order placed
          headers:
            Location:
              description: URI of the created order
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: Cancels an order before dispatch, restores inventory, refunds its payment, and cancels the delivery.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Order cancelled and payment refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [CANCELLED] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    patch:
      tags: [Orders]
      summary: Cancel an order
      description: Cancels an order before it is out for delivery, restores inventory, and refunds its payment.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order cancelled and payment refunded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [CANCELLED] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /customers/{id}/orders:
    get:
      tags: [Orders]
      summary: List customer orders
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
                  next: { type: string, nullable: true }

  # ======================== PAYMENTS ========================
  /payments:
    post:
      tags: [Payments]
      summary: Process a payment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201':
          description: Payment processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a payment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Refund issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ======================== DELIVERY ========================
  /deliveries:
    post:
      tags: [Delivery]
      summary: Create a delivery (invokes SOAP partner)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryInput' }
      responses:
        '201':
          description: Delivery created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /deliveries/{id}:
    get:
      tags: [Delivery]
      summary: Get a delivery
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Delivery found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deliveries/{id}/tracking:
    get:
      tags: [Delivery]
      summary: Get delivery tracking timeline
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tracking events
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveryId: { type: string }
                  orderId: { type: string }
                  status: { type: string }
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/TrackingEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deliveries/{id}/status:
    patch:
      tags: [Delivery]
      summary: Advance delivery status
      description: Moves a delivery through CREATED, PREPARING, OUT_FOR_DELIVERY, and a terminal status.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PREPARING, OUT_FOR_DELIVERY, DELIVERED, FAILED, CANCELLED]
                description: { type: string }
                location: { type: string, nullable: true }
      responses:
        '200':
          description: Delivery and order status updated
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ======================== REVIEWS ========================
  /products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for a product
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Review list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Review' } }
                  next: { type: string, nullable: true }
    post:
      tags: [Reviews]
      summary: Post a review
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Review posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /products/{id}/reviews/average:
    get:
      tags: [Reviews]
      summary: Get average rating for a product
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Average rating
          content:
            application/json:
              schema:
                type: object
                properties:
                  productId: { type: string }
                  average: { type: number }
                  count: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
    CursorParam:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque cursor from the previous response's `next` field.
    LimitParam:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string }
      required: true
    IfNoneMatch:
      in: header
      name: If-None-Match
      schema: { type: string }
    IfMatch:
      in: header
      name: If-Match
      schema: { type: string }

  headers:
    ETag:
      schema: { type: string }
      description: Entity tag for conditional requests.
    CacheControl:
      schema: { type: string }
    RateLimitLimit:
      schema: { type: integer }
    RateLimitRemaining:
      schema: { type: integer }

  responses:
    BadRequest:
      description: Request could not be parsed or required request metadata is missing.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated caller is not permitted to access this resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotModified:
      description: Resource unchanged (ETag match).
    PreconditionFailed:
      description: If-Match precondition failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflict (e.g., duplicate email, already refunded).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Request body failed schema validation.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        message: { type: string }
    PaymentRequired:
      description: Payment failed or insufficient funds.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: Downstream service or SOAP partner failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }

    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number }
        dietaryTags: { type: array, items: { type: string } }
        flavor: { type: string }
        imageUrl: { type: string }
        isBestseller: { type: boolean }
        stock: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name, category, price]
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, minimum: 0 }
        dietaryTags: { type: array, items: { type: string } }
        flavor: { type: string }
        imageUrl: { type: string }
        isBestseller: { type: boolean }
        stock: { type: integer, minimum: 0 }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string }
        createdAt: { type: string, format: date-time }

    CustomerInput:
      type: object
      required: [email, password, fullName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        fullName: { type: string }
        phone: { type: string }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        isDefault: { type: boolean }

    AddressInput:
      type: object
      required: [label, line1, city, state, postalCode]
      properties:
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string, default: United States }
        isDefault: { type: boolean }

    Order:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        addressId: { type: string }
        status: { type: string }
        subtotal: { type: number }
        discount: { type: number }
        tax: { type: number }
        total: { type: number }
        couponCode: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        paymentId: { type: string }
        deliveryId: { type: string }
        trackingUrl: { type: string }
        createdAt: { type: string, format: date-time }

    OrderItem:
      type: object
      properties:
        productId: { type: string }
        productName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        lineTotal: { type: number }

    OrderInput:
      type: object
      required: [customerId, items, addressId, paymentMethod]
      properties:
        customerId: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              quantity: { type: integer, minimum: 1 }
        addressId: { type: string }
        couponCode: { type: string }
        paymentMethod: { type: string, enum: [card, wallet, cod] }

    Payment:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        customerId: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }

